<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="538" viewBox="0 0 1120 538" role="img" aria-labelledby="conversation-to-context-title conversation-to-context-desc">
<title id="conversation-to-context-title">Optional conversation capture, local summary, review and reuse</title><desc id="conversation-to-context-desc">Four separately controlled stages: capture approved future conversations, summarize through a configured local model, review suggestions, then reuse approved knowledge or grant sharing access. Historical backfill is separately bounded.</desc>
<defs><linearGradient id="conversation-to-context-bg" x2="1" y2="1"><stop stop-color="#101c32"/><stop offset="1" stop-color="#172c3a"/></linearGradient><marker id="conversation-to-context-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6" fill="none" stroke="#83dacc" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="538" rx="24" fill="url(#conversation-to-context-bg)"/>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#f3f6fc"><rect x="40" y="28" width="225" height="32" rx="16" fill="#254d52"/><text x="54" y="50" font-size="14" fill="#b7f4dc" font-weight="600">OPTIONAL: SESSION HISTORY</text><text x="40" y="102" font-size="31" fill="#ffffff" font-weight="700">Turn approved conversations into useful context.</text><text x="40" y="139" font-size="19" fill="#d2deed" font-weight="400">Choose each step separately. Capture, summaries and sharing all start off.</text><rect x="40" y="192" width="236" height="214" rx="18" fill="#263c54" stroke="#4a617b"/><circle cx="74" cy="229" r="17" fill="#376765"/><text x="69" y="235" font-size="17" fill="#d8fff0" font-weight="700">1</text><text x="62" y="283" font-size="21" fill="#ffffff" font-weight="650">Capture</text><text x="62" y="321" font-size="14" fill="#d2deed" font-weight="400">Only sources you enable</text><text x="62" y="347" font-size="14" fill="#d2deed" font-weight="400">New conversations by default</text><path d="M286 294H298" fill="none" stroke="#83dacc" stroke-width="3" marker-end="url(#conversation-to-context-arrow)"/><rect x="308" y="192" width="236" height="214" rx="18" fill="#263c54" stroke="#4a617b"/><circle cx="342" cy="229" r="17" fill="#376765"/><text x="337" y="235" font-size="17" fill="#d8fff0" font-weight="700">2</text><text x="330" y="283" font-size="21" fill="#ffffff" font-weight="650">Summarize locally</text><text x="330" y="321" font-size="14" fill="#d2deed" font-weight="400">Use a configured local model</text><text x="330" y="347" font-size="14" fill="#d2deed" font-weight="400">Keep prompts on your device</text><path d="M554 294H566" fill="none" stroke="#83dacc" stroke-width="3" marker-end="url(#conversation-to-context-arrow)"/><rect x="576" y="192" width="236" height="214" rx="18" fill="#263c54" stroke="#4a617b"/><circle cx="610" cy="229" r="17" fill="#376765"/><text x="605" y="235" font-size="17" fill="#d8fff0" font-weight="700">3</text><text x="598" y="283" font-size="21" fill="#ffffff" font-weight="650">Review suggestions</text><text x="598" y="321" font-size="14" fill="#d2deed" font-weight="400">Keep, edit or reject</text><text x="598" y="347" font-size="14" fill="#d2deed" font-weight="400">Generated ideas need scrutiny</text><path d="M822 294H834" fill="none" stroke="#83dacc" stroke-width="3" marker-end="url(#conversation-to-context-arrow)"/><rect x="844" y="192" width="236" height="214" rx="18" fill="#263c54" stroke="#4a617b"/><circle cx="878" cy="229" r="17" fill="#376765"/><text x="873" y="235" font-size="17" fill="#d8fff0" font-weight="700">4</text><text x="866" y="283" font-size="21" fill="#ffffff" font-weight="650">Reuse or share</text><text x="866" y="321" font-size="14" fill="#d2deed" font-weight="400">Recall approved knowledge</text><text x="866" y="347" font-size="14" fill="#d2deed" font-weight="400">Grant access deliberately</text><rect x="40" y="432" width="1040" height="77" rx="18" fill="#1b3442" stroke="#4a617b"/><text x="63" y="464" font-size="20" fill="#c4f1e6" font-weight="600">No silent import of your entire past.</text><text x="63" y="490" font-size="16" fill="#d2deed" font-weight="400">Historical import needs separate limits. Supported apps and versions vary; check compatibility first.</text></g></svg>
