<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="how-it-works-title how-it-works-desc">
<title id="how-it-works-title">How Capsule Memory keeps context available across devices</title><desc id="how-it-works-desc">A trusted computer encrypts selected saved context before synchronization through a Cloudflare archive. Another authorized device downloads and decrypts it locally. Background sync requires explicit setup; offline changes wait locally.</desc>
<defs><linearGradient id="how-it-works-bg" x2="1" y2="1"><stop stop-color="#101c32"/><stop offset="1" stop-color="#172c3a"/></linearGradient><marker id="how-it-works-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6" fill="none" stroke="#83dacc" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="610" rx="24" fill="url(#how-it-works-bg)"/>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#f3f6fc"><rect x="40" y="30" width="270" height="32" rx="16" fill="#254d52"/><text x="54" y="52" font-size="14" fill="#b7f4dc" font-weight="600">YOUR CONTEXT. YOUR CONTROL.</text><text x="40" y="112" font-size="34" fill="#ffffff" font-weight="700">Save once. Find it where you work next.</text><text x="40" y="149" font-size="19" fill="#d2deed" font-weight="400">Memories, skill guides and optional conversation history — across connected devices.</text><rect x="40" y="205" width="270" height="264" rx="18" fill="#263c54" stroke="#4a617b"/><text x="62" y="248" font-size="21" fill="#ffffff" font-weight="650">Your computer</text><text x="62" y="277" font-size="14" fill="#d2deed" font-weight="400">Connected AI tools + local storage</text><rect x="425" y="205" width="270" height="264" rx="18" fill="#263c54" stroke="#4a617b"/><text x="447" y="248" font-size="21" fill="#ffffff" font-weight="650">Encrypted archive</text><text x="447" y="277" font-size="14" fill="#d2deed" font-weight="400">Your own Cloudflare account</text><rect x="810" y="205" width="270" height="264" rx="18" fill="#263c54" stroke="#4a617b"/><text x="832" y="248" font-size="21" fill="#ffffff" font-weight="650">Another trusted device</text><text x="832" y="277" font-size="14" fill="#d2deed" font-weight="400">Only the projects it can access</text><rect x="65" y="301" width="60" height="43" rx="6" fill="none" stroke="#83dacc" stroke-width="3"/><path d="M56 353h78" stroke="#83dacc" stroke-width="3"/><text x="65" y="390" font-size="17" fill="#ffffff" font-weight="400">Plaintext, keys and search</text><text x="65" y="416" font-size="16" fill="#d2deed" font-weight="400">stay on your trusted devices.</text><path d="M462 335c-16 0-21-22-6-30 0-25 36-29 45-10 19-8 33 6 30 20 24 7 17 32-1 32h-68" fill="none" stroke="#eac98b" stroke-width="3"/><rect x="486" y="326" width="23" height="22" rx="4" fill="#172c3a" stroke="#eac98b" stroke-width="2"/><text x="450" y="390" font-size="17" fill="#ffffff" font-weight="400">Stores encrypted copies.</text><text x="450" y="416" font-size="16" fill="#d2deed" font-weight="400">No cloud plaintext search.</text><rect x="834" y="300" width="59" height="44" rx="5" fill="none" stroke="#83dacc" stroke-width="3"/><rect x="904" y="309" width="23" height="42" rx="5" fill="none" stroke="#83dacc" stroke-width="3"/><text x="834" y="390" font-size="17" fill="#ffffff" font-weight="400">Recall saved context locally.</text><text x="834" y="416" font-size="16" fill="#d2deed" font-weight="400">Review incoming skill text.</text><path d="M324 326H411" fill="none" stroke="#83dacc" stroke-width="3" marker-end="url(#how-it-works-arrow)"/><text x="326" y="299" font-size="12" fill="#a7eadc" font-weight="700">ENCRYPT</text><path d="M709 326H796" fill="none" stroke="#83dacc" stroke-width="3" marker-end="url(#how-it-works-arrow)"/><text x="716" y="299" font-size="12" fill="#a7eadc" font-weight="700">SYNC</text><rect x="40" y="495" width="1040" height="84" rx="18" fill="#1b3442" stroke="#4a617b"/><text x="64" y="530" font-size="20" fill="#c4f1e6" font-weight="600">Background sync starts only after you enable it for chosen projects.</text><text x="64" y="558" font-size="16" fill="#d2deed" font-weight="400">While offline, saved changes wait locally. Other devices receive them when connected and authorized.</text></g></svg>
