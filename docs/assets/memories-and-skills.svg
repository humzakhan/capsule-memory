<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="554" viewBox="0 0 1120 554" role="img" aria-labelledby="memories-and-skills-title memories-and-skills-desc">
<title id="memories-and-skills-title">Saved memories sync for recall; skill text syncs for local review</title><desc id="memories-and-skills-desc">With background publication enabled for chosen scopes, saved memory and skill records synchronize as encrypted content. Incoming skills stay staged; local owner approval and activation do not synchronize. This does not install or execute skills.</desc>
<defs><linearGradient id="memories-and-skills-bg" x2="1" y2="1"><stop stop-color="#101c32"/><stop offset="1" stop-color="#172c3a"/></linearGradient><marker id="memories-and-skills-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6" fill="none" stroke="#83dacc" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="554" rx="24" fill="url(#memories-and-skills-bg)"/>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#f3f6fc"><rect x="40" y="28" width="220" height="32" rx="16" fill="#254d52"/><text x="54" y="50" font-size="14" fill="#b7f4dc" font-weight="600">AFTER BACKGROUND SETUP</text><text x="40" y="102" font-size="32" fill="#ffffff" font-weight="700">Your memories and skills travel with you.</text><text x="40" y="137" font-size="19" fill="#d2deed" font-weight="400">Sync moves saved content. You still control access and skill approval.</text><rect x="40" y="185" width="310" height="112" rx="18" fill="#263c54" stroke="#4a617b"/><text x="62" y="224" font-size="23" fill="#ffffff" font-weight="650">A saved memory</text><text x="62" y="258" font-size="15" fill="#d2deed" font-weight="400">Preference, project fact or decision</text><path d="M364 240H425" fill="none" stroke="#83dacc" stroke-width="3" marker-end="url(#memories-and-skills-arrow)"/><rect x="439" y="185" width="232" height="112" rx="18" fill="#254c50" stroke="#4a617b"/><text x="462" y="228" font-size="21" fill="#c7f4e4" font-weight="650">Encrypted sync</text><text x="462" y="261" font-size="15" fill="#d2deed" font-weight="400">Chosen projects only</text><path d="M685 240H746" fill="none" stroke="#83dacc" stroke-width="3" marker-end="url(#memories-and-skills-arrow)"/><rect x="760" y="185" width="320" height="112" rx="18" fill="#263c54" stroke="#4a617b"/><text x="781" y="224" font-size="22" fill="#ffffff" font-weight="650">Available for recall</text><text x="781" y="258" font-size="15" fill="#d2deed" font-weight="400">Connected assistants can look it up.</text><rect x="40" y="329" width="310" height="112" rx="18" fill="#263c54" stroke="#4a617b"/><text x="62" y="368" font-size="23" fill="#ffffff" font-weight="650">A saved skill guide</text><text x="62" y="402" font-size="15" fill="#d2deed" font-weight="400">A reusable written way of working</text><path d="M364 384H425" fill="none" stroke="#83dacc" stroke-width="3" marker-end="url(#memories-and-skills-arrow)"/><rect x="439" y="329" width="232" height="112" rx="18" fill="#254c50" stroke="#4a617b"/><text x="462" y="372" font-size="21" fill="#c7f4e4" font-weight="650">Encrypted sync</text><text x="462" y="405" font-size="15" fill="#d2deed" font-weight="400">Chosen projects only</text><path d="M685 384H746" fill="none" stroke="#83dacc" stroke-width="3" marker-end="url(#memories-and-skills-arrow)"/><rect x="760" y="329" width="320" height="112" rx="18" fill="#263c54" stroke="#4a617b"/><text x="781" y="368" font-size="22" fill="#ffffff" font-weight="650">Arrives for local review</text><text x="781" y="402" font-size="15" fill="#d2deed" font-weight="400">Approval does not travel with the text.</text><text x="40" y="487" font-size="17" fill="#d2deed" font-weight="400">The daemon must be running on connected devices. Manual sync remains available.</text><text x="40" y="519" font-size="17" fill="#d2deed" font-weight="400">Skill guides are text to read; syncing never installs or executes them inside your AI tools.</text></g></svg>
